<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>University Study System</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f5f7fb;--card:rgba(255,255,255,.82);--text:#172033;--muted:#68738a;--line:#dfe5ef;--accent:#3b6ff5;--danger:#d84c4c;--ok:#2e9b68}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f8fbff,#edf2f8);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.title h1{margin:0;font-size:25px}.title p{margin:4px 0;color:var(--muted);font-size:13px}.btn{background:var(--accent);color:white;padding:11px 15px;border-radius:13px;font-weight:650}.btn.secondary{background:white;color:var(--text);border:1px solid var(--line)}.nav{display:flex;gap:7px;overflow:auto;margin-bottom:16px}.nav button{padding:10px 13px;border-radius:12px;background:white;border:1px solid var(--line);white-space:nowrap;color:var(--muted)}.nav button.active{background:#e9efff;color:var(--accent);border-color:#cbd8ff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px}.stat b{font-size:23px}.stat span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;margin-bottom:14px}.panel h2{font-size:17px;margin:0 0 12px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.list{display:grid;gap:8px}.item{background:white;border:1px solid var(--line);border-radius:15px;padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:center}.item small{color:var(--muted)}.progress{height:8px;background:#e8ecf3;border-radius:99px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:var(--accent);border-radius:99px}.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#eef1f6;color:var(--muted)}.ok{background:#e5f6ed;color:var(--ok)}.modal{position:fixed;inset:0;background:rgba(20,28,44,.35);display:none;align-items:center;justify-content:center;padding:15px;z-index:5}.modal.show{display:flex}.box{background:white;border-radius:22px;padding:19px;width:min(560px,100%);max-height:90vh;overflow:auto}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fafbfe}.field textarea{min-height:110px;resize:vertical}.empty{color:var(--muted);padding:18px;text-align:center}.file{display:flex;align-items:center;gap:10px}.file a{color:var(--accent);text-decoration:none}.hidden{display:none}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.app{padding:12px}.item{align-items:flex-start}.top{align-items:flex-start}} 
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="title"><h1>🎓 University Study System</h1><p>Your offline lecture, chapter and study-rhythm manager</p></div>
    <button class="btn" id="addBtn">＋ Add</button>
  </header>
  <nav class="nav" id="nav">
    <button class="active" data-page="home">🏠 Home</button>
    <button data-page="courses">📚 Courses</button>
    <button data-page="revision">🧠 Revision</button>
    <button data-page="study">⏱ Study</button>
    <button data-page="progress">📊 Progress</button>
  </nav>
  <main id="main"></main>
</div>

<div class="modal" id="modal">
 <div class="box">
  <div class="row" style="justify-content:space-between"><h2 id="modalTitle">Add</h2><button class="btn secondary" id="close">Close</button></div>
  <form id="form"></form>
 </div>
</div>

<script>
const KEY="university-study-system-v1";
let db=JSON.parse(localStorage.getItem(KEY)||'{"semesters":[],"subjects":[],"chapters":[],"lectures":[],"sessions":[],"revisions":[],"settings":{"semester":"Current Semester"}}');
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const today=()=>new Date().toISOString().slice(0,10);
const statusBadge=s=>`<span class="badge ${s==="Completed"?"ok":""}">${esc(s)}</span>`;
function render(page="home"){
 document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
 const total=db.chapters.length, done=db.chapters.filter(x=>x.status==="Completed").length;
 const sessionsToday=db.sessions.filter(x=>x.date===today()).length;
 const due=db.revisions.filter(x=>x.date<=today()&&!x.done).length;
 let html="";
 if(page==="home") html=home(total,done,sessionsToday,due);
 if(page==="courses") html=courses();
 if(page==="revision") html=revision();
 if(page==="study") html=study();
 if(page==="progress") html=progress();
 document.getElementById("main").innerHTML=html;
 bind();
}
function home(total,done,s,due){
 const pct=total?Math.round(done/total*100):0;
 const next=db.chapters.find(x=>x.status!=="Completed");
 return `<div class="grid">
 <div class="stat"><b>${total}</b><span>Chapters</span></div><div class="stat"><b>${done}</b><span>Completed</span></div>
 <div class="stat"><b>${due}</b><span>Revisions due</span></div><div class="stat"><b>${s}</b><span>Sessions today</span></div></div>
 <section class="panel"><h2>Today's direction</h2>
 ${next?`<div class="item"><div><b>${esc(next.name)}</b><br><small>${esc(subjectName(next.subjectId))}</small><div class="progress"><i style="width:${next.status==="Studying"?50:0}%"></i></div></div><button class="btn" data-study-chapter="${next.id}">▶ Continue</button></div>`:`<div class="empty">No unfinished chapters. Add your next chapter.</div>`}</section>
 <section class="panel"><h2>Semester progress</h2><b>${pct}%</b><div class="progress"><i style="width:${pct}%"></i></div></section>
 <section class="panel"><h2>Quick actions</h2><div class="row"><button class="btn" data-add="subject">＋ Subject</button><button class="btn secondary" data-add="chapter">＋ Chapter</button><button class="btn secondary" data-add="lecture">＋ Lecture + Files</button></div></section>`;
}
function subjectName(id){return db.subjects.find(x=>x.id===id)?.name||"No subject";}
function courses(){
 if(!db.subjects.length)return `<section class="panel"><div class="empty">No subjects yet.<br><br><button class="btn" data-add="subject">＋ Add first subject</button></div></section>`;
 return `<section class="panel"><h2>Courses</h2><div class="list">${db.subjects.map(s=>{
 const cs=db.chapters.filter(c=>c.subjectId===s.id); const done=cs.filter(c=>c.status==="Completed").length; const pct=cs.length?Math.round(done/cs.length*100):0;
 return `<div class="item"><div style="flex:1"><b>${esc(s.name)}</b><br><small>${cs.length} chapters · ${pct}% complete</small><div class="progress"><i style="width:${pct}%"></i></div></div><button class="btn secondary" data-open-sub="${s.id}">Open</button></div>`}).join("")}</div></section>`;
}
function revision(){
 const rows=db.revisions.filter(r=>!r.done).sort((a,b)=>a.date.localeCompare(b.date));
 return `<section class="panel"><h2>🧠 Revision queue</h2>${rows.length?`<div class="list">${rows.map(r=>`<div class="item"><div><b>${esc(chapterName(r.chapterId))}</b><br><small>Due ${esc(r.date)}</small></div><button class="btn" data-done-rev="${r.id}">Done</button></div>`).join("")}`:`<div class="empty">No revisions due. When you finish chapters, revision dates will be created.</div>`}</section>`;
}
function chapterName(id){return db.chapters.find(x=>x.id===id)?.name||"Chapter";}
function study(){
 return `<section class="panel"><h2>⏱ Study session</h2><div style="font-size:46px;font-weight:750;text-align:center;margin:20px" id="timer">25:00</div><div class="row" style="justify-content:center"><button class="btn" id="startTimer">Start 25 min</button><button class="btn secondary" id="resetTimer">Reset</button></div><p style="color:var(--muted);text-align:center">When you finish, log the session to keep your rhythm.</p><button class="btn" data-log-session style="width:100%">＋ Log study session</button></section>
 <section class="panel"><h2>Recent sessions</h2>${db.sessions.length?`<div class="list">${db.sessions.slice().reverse().slice(0,10).map(x=>`<div class="item"><div><b>${esc(x.minutes)} minutes</b><br><small>${esc(x.date)} · ${esc(x.note||"Study session")}</small></div></div>`).join("")}`:`<div class="empty">No sessions yet.</div>`}</section>`;
}
function progress(){
 const hours=Math.round(db.sessions.reduce((a,x)=>a+(Number(x.minutes)||0),0)/60*10)/10;
 return `<section class="panel"><h2>📊 Your progress</h2><div class="grid"><div class="stat"><b>${hours}h</b><span>Total study</span></div><div class="stat"><b>${db.sessions.length}</b><span>Sessions</span></div><div class="stat"><b>${db.lectures.length}</b><span>Lectures</span></div><div class="stat"><b>${db.chapters.filter(x=>x.status==="Completed").length}</b><span>Finished</span></div></div></section>
 <section class="panel"><h2>Subject progress</h2><div class="list">${db.subjects.map(s=>{let c=db.chapters.filter(x=>x.subjectId===s.id),d=c.filter(x=>x.status==="Completed").length,p=c.length?Math.round(d/c.length*100):0;return `<div><b>${esc(s.name)}</b><small style="float:right">${p}%</small><div class="progress"><i style="width:${p}%"></i></div></div>`}).join("")||'<div class="empty">Add subjects to see progress.</div>'}</div></section>`;
}
function openModal(type){
 const title={subject:"Add Subject",chapter:"Add Chapter",lecture:"Add Lecture / Material",session:"Log Study Session"}[type];
 let body="";
 if(type==="subject")body=`<div class="field"><label>Subject name</label><input name="name" required placeholder="Algorithms"></div>`;
 if(type==="chapter")body=`<div class="field"><label>Subject</label><select name="subjectId" required>${db.subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></div><div class="field"><label>Chapter name</label><input name="name" required placeholder="Dynamic Programming"></div>`;
 if(type==="lecture")body=`<div class="field"><label>Subject</label><select name="subjectId" required>${db.subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></div><div class="field"><label>Chapter</label><select name="chapterId" required>${db.chapters.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></div><div class="field"><label>Lecture / material title</label><input name="name" required placeholder="Lecture 4 — Merge Sort"></div><div class="field"><label>Your notes</label><textarea name="notes" placeholder="Important points..."></textarea></div><div class="field"><label>Files — PDF, Office, images, audio, video, ZIP, text, etc.</label><input type="file" name="files" multiple></div>`;
 if(type==="session")body=`<div class="field"><label>Minutes studied</label><input type="number" name="minutes" min="1" required value="25"></div><div class="field"><label>What did you study?</label><input name="note" placeholder="Algorithms — Quick Sort"></div>`;
 document.getElementById("modalTitle").textContent=title; document.getElementById("form").innerHTML=body+`<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" type="submit">Save</button></div>`;
 document.getElementById("modal").classList.add("show");
 document.getElementById("form").dataset.type=type;
}
async function submitForm(e){
 e.preventDefault(); const f=new FormData(e.target),type=e.target.dataset.type;
 if(type==="subject")db.subjects.push({id:uid(),name:f.get("name")});
 if(type==="chapter"){db.chapters.push({id:uid(),subjectId:f.get("subjectId"),name:f.get("name"),status:"Not Started"});}
 if(type==="session")db.sessions.push({id:uid(),date:today(),minutes:Number(f.get("minutes")),note:f.get("note")});
 if(type==="lecture"){
   const files=[...e.target.querySelector('[name=files]').files].map(x=>({name:x.name,type:x.type,size:x.size}));
   db.lectures.push({id:uid(),subjectId:f.get("subjectId"),chapterId:f.get("chapterId"),name:f.get("name"),notes:f.get("notes"),files,date:today()});
 }
 save(); document.getElementById("modal").classList.remove("show"); render(currentPage);
}
let currentPage="home",timer=null,remaining=1500;
function bind(){
 document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{currentPage=b.dataset.page;render(currentPage)});
 document.getElementById("addBtn").onclick=()=>openModal("subject");
 document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>openModal(b.dataset.add));
 document.querySelectorAll("[data-done-rev]").forEach(b=>b.onclick=()=>{let r=db.revisions.find(x=>x.id===b.dataset.doneRev);if(r)r.done=true;save();render(currentPage)});
 document.querySelectorAll("[data-study-chapter]").forEach(b=>b.onclick=()=>{let c=db.chapters.find(x=>x.id===b.dataset.studyChapter);if(c)c.status="Studying";save();currentPage="study";render("study")});
 document.querySelectorAll("[data-log-session]").forEach(b=>b.onclick=()=>openModal("session"));
 const st=document.getElementById("startTimer"),rs=document.getElementById("resetTimer");
 if(st)st.onclick=()=>{if(timer)return;timer=setInterval(()=>{remaining--;updateTimer();if(remaining<=0){clearInterval(timer);timer=null;alert("Study session complete.");}},1000)};
 if(rs)rs.onclick=()=>{clearInterval(timer);timer=null;remaining=1500;updateTimer()};
}
function updateTimer(){const el=document.getElementById("timer");if(el)el.textContent=`${String(Math.floor(remaining/60)).padStart(2,"0")}:${String(remaining%60).padStart(2,"0")}`}
document.getElementById("close").onclick=()=>document.getElementById("modal").classList.remove("show");
document.getElementById("form").onsubmit=submitForm;
render();
</script>
</body>
</html>
